<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101828" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101828'/%3E%3Cpath d='M16 44h32L32 16z' fill='%2367e8f9'/%3E%3C/svg%3E"
    />
    <title>Sky Climber</title>
    <style>
      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        overflow: hidden;
        background: #101828;
        color: #f8fafc;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior: none;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        background: #101828;
      }

      #loading-shell {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: rgba(248, 250, 252, 0.84);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #app.ready #loading-shell {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Sky Climber game">
      <canvas id="game" aria-label="Sky Climber game canvas"></canvas>
      <div id="loading-shell">Loading Sky Climber...</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
